  from: action1
  to: entityR1
  direction: return
- id: edge1R1U
  type: used by
  from: entityR1
  to: action0
  direction: return
- id: edgePrv0U
  type: used by
  from: entityPrv0
  to: action0
- id: edgePrv0AU
  type: used by
  from: entityPrv0A
  to: action0
- id: edgePub0U
  type: used by
  from: entityPub0
  to: action1
- id: edge1U
  type: used by
  from: entity1
  to: action2
  notes: Shareholders participate through their stake. Continuing operations sustain the opportunity
    for distributions and future value, with outcomes depending on performance and other factors.
- id: edge2G
